<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard Admin</title>
  <style>
    :root {
      --bg:      #0a0c16;
      --surface: #0e101e;
      --border:  #1e2240;
      --text:    #d2d7f0;
      --dim:     #5a6482;
      --accent:  #40a8ff;
      --red:     #e05555;
      --red-dim: #7a2020;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 { font-size: 18px; color: var(--red); letter-spacing: 0.05em; }
    header span { color: var(--dim); font-size: 12px; }

    .auth-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .auth-bar label { color: var(--dim); font-size: 12px; white-space: nowrap; }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .controls label { color: var(--dim); font-size: 12px; }

    select, input[type="text"], input[type="password"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }

    button {
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 13px;
    }

    .btn-load {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 600;
    }
    .btn-load:hover { opacity: 0.85; }

    .btn-delete {
      background: transparent;
      border-color: var(--red-dim);
      color: var(--red);
      padding: 3px 10px;
      font-size: 12px;
    }
    .btn-delete:hover { background: var(--red-dim); }
    .btn-delete:disabled { opacity: 0.4; cursor: default; }

    .btn-purge {
      background: transparent;
      border-color: var(--red-dim);
      color: var(--red);
    }
    .btn-purge:hover { background: var(--red-dim); }

    .main { max-width: 1600px; margin: 0 auto; padding: 24px; }

    .status {
      padding: 10px 16px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }
    .status.ok  { background: #0d2e1a; border: 1px solid #1a5c33; color: #50e68c; display: block; }
    .status.err { background: #2e0d0d; border: 1px solid #7a2020; color: var(--red); display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead th {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
      color: var(--dim);
      font-weight: 600;
      font-size: 11px;
      white-space: nowrap;
    }

    tbody tr:nth-child(odd)  { background: var(--bg); }
    tbody tr:nth-child(even) { background: #0c0f1c; }
    tbody tr:hover { background: #141830; }
    tbody tr.deleted { opacity: 0.3; pointer-events: none; }

    td {
      padding: 6px 10px;
      border-bottom: 1px solid #12142a;
      white-space: nowrap;
    }

    .id-cell {
      font-family: monospace;
      font-size: 10px;
      color: var(--dim);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loading { text-align: center; padding: 40px; color: var(--dim); }
    .empty   { text-align: center; padding: 60px 20px; color: var(--dim); }

    #count { color: var(--dim); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>&#9888; Leaderboard Admin</h1>
    <span>Restricted — do not share this URL</span>
  </header>

  <div class="auth-bar">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="enter API key" style="width:260px" />
  </div>

  <div class="controls">
    <label>Mob</label>
    <select id="mobSelect">
      <option value="">All mobs</option>
    </select>
    <label>Character</label>
    <input type="text" id="charInput" placeholder="all characters" style="width:140px" />
    <label>Server</label>
    <input type="text" id="serverInput" placeholder="all servers" style="width:120px" />
    <button class="btn-load" id="loadBtn">Load Records</button>
    <span id="count"></span>
    <div style="flex:1"></div>
    <button class="btn-purge" id="purgeBtn" title="Delete all records whose mob is not on the allowlist">Purge Non-Allowlist</button>
  </div>

  <div class="main">
    <div id="status" class="status"></div>
    <div id="content" class="empty">Enter your API key and click Load Records.</div>
  </div>

  <script>
    const apiKeyInput  = document.getElementById('apiKey')
    const mobSelect    = document.getElementById('mobSelect')
    const charInput    = document.getElementById('charInput')
    const serverInput  = document.getElementById('serverInput')
    const loadBtn      = document.getElementById('loadBtn')
    const purgeBtn     = document.getElementById('purgeBtn')
    const content      = document.getElementById('content')
    const statusEl     = document.getElementById('status')
    const countEl      = document.getElementById('count')

    const BASE = location.origin

    // Restore API key from sessionStorage
    apiKeyInput.value = sessionStorage.getItem('admin_key') ?? ''
    apiKeyInput.addEventListener('input', () => sessionStorage.setItem('admin_key', apiKeyInput.value))

    function apiKey() { return apiKeyInput.value.trim() }

    function showStatus(msg, isErr) {
      statusEl.textContent = msg
      statusEl.className = 'status ' + (isErr ? 'err' : 'ok')
      setTimeout(() => { statusEl.className = 'status' }, 4000)
    }

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function fmtDate(ts) {
      const n = Number(ts)
      if (!n) return '—'
      return new Date(n).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })
    }

    function fmtDur(ms) {
      const s = Math.round(ms / 1000)
      const m = Math.floor(s / 60)
      return m > 0 ? `${m}m ${s % 60}s` : `${s}s`
    }

    async function loadMobs() {
      const res = await fetch(`${BASE}/api/mobs`)
      if (!res.ok) return
      const { mobs } = await res.json()
      // Clear existing options beyond "All mobs"
      while (mobSelect.options.length > 1) mobSelect.remove(1)
      mobs.forEach(m => {
        const opt = document.createElement('option')
        opt.value = m.mob_name
        opt.textContent = `${m.mob_name} (${m.count})`
        mobSelect.appendChild(opt)
      })
    }

    async function loadRecords() {
      if (!apiKey()) { showStatus('Enter an API key first.', true); return }

      const mob    = mobSelect.value
      const char   = charInput.value.trim()
      const server = serverInput.value.trim()

      const params = new URLSearchParams({ limit: '500' })
      if (mob)    params.set('mob', mob)
      if (server) params.set('server', server)

      let url = char
        ? `${BASE}/api/records?${new URLSearchParams({ char, limit: '500', ...(server ? { server } : {}) })}`
        : `${BASE}/api/leaderboard?${params}`

      content.innerHTML = '<div class="loading">Loading…</div>'
      countEl.textContent = ''

      const res = await fetch(url)
      if (!res.ok) { showStatus('Failed to load records.', true); content.innerHTML = '<div class="empty">Load failed.</div>'; return }

      const data = await res.json()
      const records = data.records ?? []

      countEl.textContent = `${records.length} record${records.length !== 1 ? 's' : ''}`

      if (!records.length) { content.innerHTML = '<div class="empty">No records found.</div>'; return }

      records.sort((a, b) => b.timestamp - a.timestamp)

      const rows = records.map(r => {
        const discs = (() => { try { const d = JSON.parse(r.disciplines_used ?? '[]'); return d.join(', ') || '—' } catch { return '—' } })()
        return `<tr id="row-${escHtml(r.id)}">
          <td><button class="btn-delete" onclick="deleteRecord('${escHtml(r.id)}')">Delete</button></td>
          <td class="id-cell" title="${escHtml(r.id)}">${escHtml(r.id)}</td>
          <td>${escHtml(r.character_name || '—')}</td>
          <td>${escHtml(r.server_name || '—')}</td>
          <td>${escHtml(r.mob_name)}</td>
          <td>${escHtml(r.grade)}</td>
          <td>${(r.total_dps ?? 0).toFixed(1)}</td>
          <td>${(r.fist_dps ?? 0).toFixed(1)}</td>
          <td>${escHtml(r.mainhand || '—')}</td>
          <td>${escHtml(r.offhand  || '—')}</td>
          <td>${r.atk_rating || '—'}</td>
          <td>${r.haste_pct ? r.haste_pct.toFixed(0) + '%' : '—'}</td>
          <td>${escHtml(discs)}</td>
          <td>${fmtDur(r.engaged_ms ?? 0)}</td>
          <td>${fmtDate(r.timestamp)}</td>
        </tr>`
      }).join('')

      content.innerHTML = `<table>
        <thead><tr>
          <th></th>
          <th>ID</th><th>Character</th><th>Server</th><th>Mob</th><th>Grade</th>
          <th>Total DPS</th><th>Weave DPS</th>
          <th>Mainhand</th><th>Offhand</th><th>ATK</th><th>Haste%</th>
          <th>Discs</th><th>Engaged</th><th>Date</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`
    }

    async function deleteRecord(id) {
      if (!apiKey()) { showStatus('Enter an API key first.', true); return }
      const btn = document.querySelector(`#row-${CSS.escape(id)} .btn-delete`)
      if (btn) btn.disabled = true

      const res = await fetch(`${BASE}/api/records?id=${encodeURIComponent(id)}`, {
        method: 'DELETE',
        headers: { 'X-API-Key': apiKey() }
      })

      if (!res.ok) {
        const data = await res.json().catch(() => ({}))
        showStatus(`Delete failed: ${data.error ?? res.status}`, true)
        if (btn) btn.disabled = false
        return
      }

      const row = document.getElementById(`row-${id}`)
      if (row) row.classList.add('deleted')
      showStatus('Record deleted.', false)
    }

    async function purgeNonAllowlist() {
      if (!apiKey()) { showStatus('Enter an API key first.', true); return }
      if (!confirm('Delete ALL records whose mob name is not on the allowlist?')) return

      purgeBtn.disabled = true
      const res = await fetch(`${BASE}/api/records`, {
        method: 'DELETE',
        headers: { 'X-API-Key': apiKey() }
      })
      purgeBtn.disabled = false

      if (!res.ok) {
        const data = await res.json().catch(() => ({}))
        showStatus(`Purge failed: ${data.error ?? res.status}`, true)
        return
      }

      const { deleted } = await res.json()
      showStatus(`Purged ${deleted} non-allowlist record${deleted !== 1 ? 's' : ''}.`, false)
      loadRecords()
    }

    loadBtn.addEventListener('click', loadRecords)
    purgeBtn.addEventListener('click', purgeNonAllowlist)

    loadMobs()
  </script>
</body>
</html>
